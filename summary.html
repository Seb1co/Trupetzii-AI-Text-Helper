<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary - Studia</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script src="auth.js" defer></script>

<style>
    .summary-page {
        min-height: 100vh;
        margin-left: 250px;
        padding: 42px clamp(20px, 5vw, 64px);
        transition: margin-left 0.3s ease;
    }

    .sidebar.close ~ .summary-page {
        margin-left: 78px;
    }

    .summary-header,
    .summary-box {
        width: min(100%, 900px);
        margin-right: auto;
        margin-left: auto;
    }

    .summary-header {
        margin-bottom: 24px;
    }

    .summary-home {
        color: var(--primary-color);
        text-decoration: none;
    }

    .summary-home:hover {
        text-decoration: underline;
    }

    .summary-box {
        padding: 24px;
        color: var(--text-color);
        background: var(--primary-color-light);
        border: 1px solid var(--body-color);
        border-radius: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        transition: background-color 0.3s ease, color 0.3s ease,
                    border-color 0.3s ease;
    }

    @media (max-width: 700px) {
        .summary-page {
            margin-left: 78px;
            padding: 32px 16px;
        }
    }
</style>

    
    
</head>
<body>
    <nav class="sidebar">
        <header>
            <div class="image-text">
                <span class="image logo-mark" aria-label="Studia logo">S</span>
                <div class="text header-text">
                    <span class="name">Studia</span>
                    <span class="profession">Learning Space</span>
                </div>
            </div>
            <button class="toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">
                <i class="bx bx-chevron-right" aria-hidden="true"></i>
            </button>
        </header>
        <div class="menu-bar">
            <div class="menu">
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="index.html">
                            <i class="bx bx-home-alt icon" aria-hidden="true"></i>
                            <span class="text nav-text">Home</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="library.html" aria-current="page">
                            <i class="bx bx-book icon" aria-hidden="true"></i>
                            <span class="text nav-text">My Library</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="audio.html">
                            <i class="bx bx-headphone icon" aria-hidden="true"></i>
                            <span class="text nav-text">Audio Session</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="login.html" data-logout>
                            <i class="bx bx-log-out icon" aria-hidden="true"></i>
                            <span class="text nav-text">Log out</span>
                        </a>
                    </li>
                    <li class="mode">
                        <div class="moon-sun" aria-hidden="true">
                            <i class="bx bx-moon moon"></i>
                            <i class="bx bx-sun sun"></i>
                        </div>
                        <span class="mode-text text">Dark Mode</span>
                        <button class="toggle-switch" type="button" aria-label="Switch to dark mode" aria-pressed="false">
                            <span class="switch"></span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="summary-page">
        <header class="summary-header">
            <a class="summary-home" href="index.html">← Back to Home</a>
        </header>

        <article class="summary-box">
            <h1 id="title">Summary</h1>
            <p id="fileName"></p>
            <p id="text"></p>
        </article>
    </main>

    <script>
        let selectedItem = null;
        try {
            selectedItem = JSON.parse(localStorage.getItem('studia-selected-summary') || 'null');
        } catch {
            selectedItem = null;
        }

        if (selectedItem) {
            document.getElementById('title').textContent =
                selectedItem.title || selectedItem.fileName || 'Summary';
            document.getElementById('fileName').textContent = selectedItem.fileName
                ? `Source file: ${selectedItem.fileName}`
                : '';

            const summaryText = selectedItem.summaryText || selectedItem.summary ||
                selectedItem.content || selectedItem.text;
            document.getElementById('text').textContent =
                typeof summaryText === 'string' && summaryText.trim()
                    ? summaryText
                    : 'No summary text has been saved for this item yet.';
        } else {
            document.getElementById('text').textContent = 'No summary selected.';
        }
    </script>
    <script src="sidebar.js"></script>
</body>
</html>
